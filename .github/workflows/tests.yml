name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python-Dateien prüfen
        run: python -m compileall -q custom_components/xt500_energy_manager

      - name: Controller-Tests ausführen
        run: python -m unittest discover -s tests -v

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dashboard-Strategie prüfen
        run: node --check custom_components/xt500_energy_manager/frontend/xt500-energy-dashboard-strategy.js

